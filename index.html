<title>恐龍追小雞</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Huninn&family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
<style>
/* 版面：標題 → 遊戲場(畫布+開始/結束面板) → 兩顆技能鍵 → 技能收集 → 戰友圖鑑 */
:root{
  --bg:#EAF1E4; --fg:#18281E; --muted:#51655A; --panel:#FFFFFF; --line:#C5D4C1; --ctl:#E3ECDF;
  --chick:#F5B800; --chick-ink:#2A2100; --heart:#C42E64; --heart-ink:#FFFFFF; --dino:#2E8B57;
  --font-display:"Huninn","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --font-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1A14; --fg:#E7F0E3; --muted:#9DB3A3; --panel:#18271E; --line:#2C4234; --ctl:#223329; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1A14; --fg:#E7F0E3; --muted:#9DB3A3; --panel:#18271E; --line:#2C4234; --ctl:#223329; color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.6;padding-inline:16px;padding-block:20px 40px}
.wrap{max-width:900px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.pg-title{font:400 clamp(28px,6vw,42px)/1.1 var(--font-display);margin:0;text-wrap:balance}
.lede{margin:6px 0 0;color:var(--muted);max-width:60ch}
h3{margin:0 0 8px;font-size:12.5px;letter-spacing:.12em;color:var(--muted);font-weight:700}
.stage{position:relative;border-radius:16px;overflow:hidden;border:2px solid var(--line);background:#6DB05C;margin-inline:auto;
  width:min(100%,calc((100vh - var(--reserve,140px)) * var(--ratio,1.5)));
  width:min(100%,calc((100dvh - var(--reserve,140px)) * var(--ratio,1.5)));
  -webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#cv{display:block;width:100%;height:auto;touch-action:none;user-select:none;-webkit-user-select:none}
.veil{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:12px;background:rgba(9,22,14,.55)}
.card{background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:14px;padding:18px 20px;max-width:440px;width:100%;max-height:100%;overflow:auto;display:flex;flex-direction:column;gap:12px}
.card h2{margin:0;font:400 26px/1.2 var(--font-display)}
.card p{margin:0}
dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0}
dt{font-weight:700;white-space:nowrap}
dd{margin:0;color:var(--muted);min-width:0}
kbd{font:inherit;font-size:12px;padding:1px 6px;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;background:var(--ctl);color:var(--fg)}
.cover{flex-direction:column;justify-content:space-between;align-items:center;text-align:center;
  padding:clamp(18px,7%,48px) 16px clamp(20px,8%,52px);
  background:linear-gradient(to bottom,rgba(8,26,14,.78) 0%,rgba(8,26,14,.15) 36%,rgba(8,26,14,.1) 62%,rgba(8,26,14,.72) 100%)}
.cv-head{display:flex;flex-direction:column;align-items:center;gap:6px}
.cv-title{margin:0;font:400 clamp(46px,14vw,92px)/1.02 var(--font-display);color:#fff;letter-spacing:.02em;
  -webkit-text-stroke:.09em #1d4a2a;paint-order:stroke fill;text-shadow:0 .05em 0 #1d4a2a,0 .12em .3em rgba(0,0,0,.4);text-wrap:balance}
.cv-title b{font-weight:400;color:var(--chick)}
.cv-tag{margin:0;font:400 clamp(15px,3.6vw,21px) var(--font-display);letter-spacing:.35em;text-indent:.35em;color:#fff;text-shadow:0 2px 6px rgba(0,0,0,.7)}
.cv-foot{display:flex;flex-direction:column;align-items:center;gap:14px}
.start{position:relative;font:400 clamp(22px,5.5vw,30px) var(--font-display);padding:14px 46px;border:0;border-radius:999px;background:var(--chick);color:var(--chick-ink);cursor:pointer;
  box-shadow:0 5px 0 #a87d00,0 12px 26px rgba(0,0,0,.4);touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.start::after{content:"";position:absolute;inset:0;border-radius:inherit;border:3px solid #fff;pointer-events:none;animation:ring 1.9s ease-out infinite}
.start:active{transform:translateY(3px);box-shadow:0 2px 0 #a87d00,0 6px 14px rgba(0,0,0,.4)}
.start:focus-visible{outline:3px solid #fff;outline-offset:4px}
@keyframes ring{from{transform:scale(1);opacity:.85}to{transform:scale(1.3,1.7);opacity:0}}
@media (prefers-reduced-motion:reduce){.start::after{animation:none;opacity:0}}
.cv-best{margin:0;font-size:14px;color:#fff;background:rgba(0,0,0,.35);padding:3px 14px;border-radius:999px}
.cv-best:empty{display:none}
@media (max-height:520px){.cv-title{font-size:clamp(34px,8vw,54px)}.cv-tag{display:none}.start{padding:10px 38px}.cover{padding-block:12px 14px}.cv-foot{gap:8px}}
.go{align-self:flex-start;border:0;border-radius:10px;padding:11px 20px;font:400 18px var(--font-display);background:var(--chick);color:var(--chick-ink);cursor:pointer}
.go:disabled{opacity:.45;cursor:default}
.go:focus-visible,.pbtn:focus-visible,.psm:focus-visible{outline:3px solid var(--fg);outline-offset:2px}
.best{color:var(--muted);font-size:13px}
.pad{position:absolute;right:10px;bottom:10px;display:flex;gap:12px;align-items:flex-end;pointer-events:none}
.pbtn{pointer-events:auto;position:relative;overflow:hidden;width:72px;height:72px;padding:0;border-radius:50%;border:3px solid rgba(255,255,255,.6);
  display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--font-display);cursor:pointer;
  touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;box-shadow:0 2px 8px rgba(0,0,0,.25);transition:background .12s}
.pbtn .i{font-size:26px;line-height:1.05}
.pbtn .n{font-size:13px;line-height:1.1}
.pbtn .k{display:none;font-size:10px;line-height:1.1;opacity:.85}
.pbtn.a{background:var(--chick);background:color-mix(in srgb,var(--chick) 50%,transparent);color:var(--chick-ink);text-shadow:0 1px 2px rgba(255,255,255,.6)}
.pbtn.b{background:var(--heart);background:color-mix(in srgb,var(--heart) 50%,transparent);color:var(--heart-ink);text-shadow:0 1px 2px rgba(0,0,0,.55)}
.pbtn.a:active{background:color-mix(in srgb,var(--chick) 90%,transparent)}
.pbtn.b:active{background:color-mix(in srgb,var(--heart) 90%,transparent)}
.psm{position:absolute;top:42px;right:8px;width:44px;height:44px;padding:0;border-radius:50%;border:2px solid rgba(255,255,255,.55);background:rgba(15,30,20,.35);
  display:flex;align-items:center;justify-content:center;gap:5px;cursor:pointer;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
.psm i{display:block;width:5px;height:16px;border-radius:2px;background:#fff}
.psm:active{background:rgba(15,30,20,.7)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.go.alt{background:var(--ctl);color:var(--fg);border:1px solid var(--line)}
.pbtn::after{content:"";position:absolute;inset:0;background:conic-gradient(rgba(0,0,0,.4) calc(var(--p,0) * 360deg),transparent 0);pointer-events:none}
.pbtn:active{transform:scale(.93)}
@media (hover:hover) and (pointer:fine){.pbtn{width:68px;height:68px}.pbtn .k{display:block}}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{width:38px;height:38px;display:grid;place-items:center;border-radius:10px;background:var(--panel);border:1px solid var(--line);font-size:19px;filter:grayscale(1);opacity:.4}
.chip.on{filter:none;opacity:1}
.chip.lock{filter:none;opacity:.55;font-size:16px}
.bh{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 8px}
.bh h3{margin:0;min-width:0}
.bsw{white-space:nowrap;flex:none;display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);cursor:pointer}
.bsw.off{opacity:.45}
.b3note{margin:0 0 10px;color:var(--muted);font-size:13px;max-width:62ch}
.b3list{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px}
.b3list.top{margin-bottom:8px}
.b3row{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:9px 12px;cursor:pointer;min-width:0}
.b3row.on{border-color:var(--heart)}
.b3row .e{font-size:26px;line-height:1;flex:none}
.b3row .t{display:flex;flex-direction:column;flex:1;min-width:0}
.b3row small{color:var(--muted);font-size:12.5px;line-height:1.35}
.sw{appearance:none;-webkit-appearance:none;flex:none;width:44px;height:26px;border-radius:999px;background:var(--ctl);border:1px solid var(--line);position:relative;cursor:pointer;transition:background .15s;margin:0}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:var(--muted);transition:transform .15s,background .15s}
.sw:checked{background:var(--heart);border-color:var(--heart)}
.sw:checked::after{transform:translateX(18px);background:#fff}
.sw:focus-visible{outline:3px solid var(--fg);outline-offset:2px}
.zoo{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.pal{display:flex;gap:10px;align-items:flex-start;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0}
.pal .e{font-size:28px;line-height:1.1}
.pal strong{display:block}
.pal span.t{color:var(--muted);font-size:13px}
.fs,.fs body{overflow:hidden;height:100%;overscroll-behavior:none}
.fs .stage{position:fixed;inset:0;z-index:100;width:auto;margin:0;border:0;border-radius:0;background:#6DB05C;
  padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
.fs #cv{width:100%;height:100%}
.fs .pad{right:calc(10px + env(safe-area-inset-right,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px))}
.fs .psm{top:calc(48px + env(safe-area-inset-top,0px));right:calc(8px + env(safe-area-inset-right,0px))}
@media (max-width:640px){
  body{padding-block:10px 28px}
  .wrap{gap:10px}
  .lede{display:none}
  .pg-title{font-size:24px}
  .stage{--reserve:76px;border-radius:12px}
  .pad{right:8px;bottom:8px}
}
@media (max-height:520px) and (min-width:640px){
  body{padding-block:8px 24px}
  header{display:none}
  .stage{--reserve:20px}
}
</style>

<main class="wrap">
  <section class="stage" id="stage" aria-label="遊戲畫面">
    <canvas id="cv" width="840" height="560" role="img" aria-label="暴龍在草地上追小雞的遊戲畫面"></canvas>
    <div class="pad" id="pad" hidden>
      <button type="button" class="pbtn a" id="bAb" tabindex="-1" aria-label="隨機沙雕技" aria-keyshortcuts="Space"><span class="i">🎲</span><span class="n">沙雕技</span><span class="k">空白鍵</span></button>
      <button type="button" class="pbtn b" id="bCh" tabindex="-1" aria-label="媚眼色誘" aria-keyshortcuts="E"><span class="i">😉</span><span class="n">媚眼</span><span class="k">E</span></button>
    </div>

    <button type="button" class="psm" id="bPause" hidden tabindex="-1" aria-label="暫停" aria-keyshortcuts="P"><i></i><i></i></button>

    <div class="veil cover" id="vStart">
      <div class="cv-head">
        <h1 class="cv-title">恐龍追<b>小雞</b></h1>
        <p class="cv-tag">小雞，快跑</p>
      </div>
      <div class="cv-foot">
        <button type="button" class="start" id="goBtn">開始逃命</button>
        <p class="cv-best" id="bestLine"></p>
      </div>
    </div>

    <div class="veil" id="vPause" hidden>
      <div class="card">
        <h2>暫停中</h2>
        <p>喘口氣吧，恐龍也會在原地等你。繼續後小雞有 1 秒多的無敵時間。</p>
        <div class="row">
          <button type="button" class="go" id="resumeBtn">繼續</button>
          <button type="button" class="go alt" id="restartBtn">重新開始</button>
          <button type="button" class="go alt" id="exitBtn">回首頁</button>
          <button type="button" class="go alt" id="sfxBtn">音效：開</button>
        </div>
      </div>
    </div>

    <div class="veil" id="vOver" hidden>
      <div class="card">
        <h2>被吃掉了</h2>
        <p id="rate"></p>
        <dl>
          <dt>存活</dt><dd id="stT"></dd>
          <dt>總分</dt><dd id="stS"></dd>
          <dt>被你迷倒的動物</dt><dd id="stC"></dd>
          <dt>恐龍被打暈</dt><dd id="stD"></dd>
          <dt>沙雕技</dt><dd id="stU"></dd>
        </dl>
        <div class="row">
          <button type="button" class="go" id="againBtn">再來一局</button>
          <button type="button" class="go alt" id="homeBtn">回首頁</button>
        </div>
        <p class="best" id="bestLine2"></p>
      </div>
    </div>
  </section>

  <section>
    <div class="bh"><h3 id="unlockTitle">沙雕技收集</h3><label class="bsw"><span>加入隨機</span><input type="checkbox" class="sw" id="bon1" role="switch" aria-label="開啟第一梯次"></label></div>
    <div class="chips" id="chips"></div>
  </section>

  <section>
    <div class="bh"><h3 id="unlock2Title">第二批沙雕技</h3><label class="bsw"><span>加入隨機</span><input type="checkbox" class="sw" id="bon2" role="switch" aria-label="開啟第二梯次"></label></div>
    <div class="chips" id="chips2"></div>
  </section>

  <section>
    <div class="bh"><h3 id="b3Title">第三梯次　混亂模式</h3><label class="bsw"><span>加入隨機</span><input type="checkbox" class="sw" id="bon3" role="switch" aria-label="開啟第三梯次"></label></div>
    <p class="b3note">超怪、超無厘頭的招式，帶強烈光影、畫面震動和大音量音效，有光敏感體質請不要開啟。收集完第二批後解鎖，預設關閉。</p>
    <div class="chips" id="chips3"></div>
  </section>

  <section>
    <h3>音效</h3>
    <div class="b3list top">
      <label class="b3row" id="sfxRow"><span class="e">🔊</span><span class="t"><strong>音效</strong><small>所有招式的聲音，預設開啟</small></span><input type="checkbox" class="sw" id="sfxSw" role="switch"></label>
    </div>
  </section>

  <section>
    <h3>戰友圖鑑</h3>
    <div class="zoo" id="zoo"></div>
  </section>
</main>

<script>
(function(){
'use strict';
const $=s=>document.querySelector(s);
const cv=$('#cv'),ctx=cv.getContext('2d');
const RM=!!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches);
const EMO='"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
const TXT='"Huninn","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif';
const AB_CD=6.5,CH_CD=4,CH_CD0=10,CH_RAMP=60;
function chCd(){const k=Math.min(1,S.t/CH_RAMP);return CH_CD0+(CH_CD-CH_CD0)*k;}
const rnd=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
let W=840,H=560,dpr=1,bg=null,wk='',ui=1,SP=1,frame=0,S=null,last=0,joy=null;
const keys={};

/* ---------- 動物資料 ---------- */
const SPECIES=[
  {id:'goat',emo:'🐐',name:'山羊',size:38,spd:70,charge:220,stun:1.7,hits:2,life:14,knock:270,fx:'頭槌，恐龍暈得最久之一',say:['咩～我來撞！','小雞你好香（是草）']},
  {id:'turtle',emo:'🐢',name:'烏龜',size:34,spd:42,charge:110,stun:1.0,hits:4,life:22,knock:150,fx:'硬殼耐撞，守得最久',say:['不急，我慢慢擋','殼借你躲']},
  {id:'boar',emo:'🐗',name:'野豬',size:40,spd:85,charge:310,stun:1.3,hits:2,life:12,knock:310,fx:'衝撞速度最快',say:['哼哼！誰敢動小雞！','讓開讓開讓開']},
  {id:'frog',emo:'🐸',name:'青蛙',size:30,spd:90,charge:250,stun:1.1,hits:2,life:12,knock:170,fx:'跳臉，恐龍之後會變慢',say:['呱～被你電到了','呱！跳他頭上！']},
  {id:'duck',emo:'🦆',name:'鴨子',size:32,spd:80,charge:230,stun:1.0,hits:3,life:14,knock:160,fx:'吵到恐龍暈頭轉向亂走',say:['嘎！（意思是愛你）','嘎嘎嘎嘎嘎']},
  {id:'hedgehog',emo:'🦔',name:'刺蝟',size:30,spd:55,charge:160,stun:1.9,hits:3,life:16,knock:120,fx:'尖刺，恐龍痛到發呆',say:['我有刺，但對你沒有','來啊，我很硬']}
];

/* ---------- 世界尺寸與背景 ---------- */
function makeBg(){
  const o=document.createElement('canvas');o.width=Math.round(W*dpr);o.height=Math.round(H*dpr);
  const g=o.getContext('2d');g.scale(dpr,dpr);
  const n=14,bw=W/n;
  for(let i=0;i<n;i++){g.fillStyle=i%2?'#74B661':'#7BBC68';g.fillRect(i*bw,0,bw+1,H);}
  g.strokeStyle='#5C9E4C';g.lineWidth=1.6;g.lineCap='round';
  for(let i=0;i<110;i++){const x=rnd(0,W),y=rnd(0,H);g.beginPath();g.moveTo(x,y);g.lineTo(x-3,y-7);g.moveTo(x,y);g.lineTo(x+3,y-8);g.moveTo(x,y);g.lineTo(x,y-9);g.stroke();}
  const fc=['#FFFFFF','#FFE46B','#FF9EC4'];
  for(let i=0;i<26;i++){const x=rnd(0,W),y=rnd(0,H);g.fillStyle=pick(fc);g.beginPath();g.arc(x,y,3,0,7);g.fill();g.fillStyle='#E9A100';g.beginPath();g.arc(x,y,1.2,0,7);g.fill();}
  for(let i=0;i<6;i++){const x=rnd(30,W-30),y=rnd(60,H-30);g.fillStyle='rgba(60,70,60,.28)';g.beginPath();g.ellipse(x+2,y+4,16,7,0,0,7);g.fill();g.fillStyle='#A8AEA3';g.beginPath();g.ellipse(x,y,15,9,0,0,7);g.fill();g.fillStyle='#C3C8BD';g.beginPath();g.ellipse(x-3,y-3,8,4,0,0,7);g.fill();}
  const rg=g.createRadialGradient(W/2,H/2,Math.min(W,H)*.45,W/2,H/2,Math.max(W,H)*.75);
  rg.addColorStop(0,'rgba(0,0,0,0)');rg.addColorStop(1,'rgba(10,40,20,.35)');
  g.fillStyle=rg;g.fillRect(0,0,W,H);
  return o;
}
function isFs(){return document.documentElement.classList.contains('fs');}
function worldFor(){
  if(isFs()){
    const st=$('#stage'),cs=getComputedStyle(st);
    const aw=st.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight);
    const ah=st.clientHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom);
    if(aw>50&&ah>50){
      const k=clamp(Math.min(aw,ah)/400,.9,1.35);
      const w=Math.round(aw/k),h=Math.round(ah/k);
      return{w,h,k:'f'+w+'x'+h};
    }
  }
  if(innerWidth<640)return{w:400,h:560,k:'p'};
  if(innerHeight<560)return{w:640,h:430,k:'l'};
  return{w:840,h:560,k:'d'};
}
function calcUi(){const cs=cv.clientWidth/W;ui=cs>0?clamp(1/cs,1,1.6):1;}
function sizeWorld(){
  const n=worldFor(),ow=W,oh=H,ch=n.k!==wk;
  wk=n.k;W=n.w;H=n.h;SP=isFs()?clamp(Math.min(W,H)/500,.8,1):(W<500?.8:(W<700?.9:1));
  dpr=Math.min(window.devicePixelRatio||1,2);
  cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);
  $('#stage').style.setProperty('--ratio',(W/H).toFixed(4));
  bg=makeBg();
  if(ch&&S)rescale(ow,oh);
  calcUi();
}

function ac(){
  if(AC===null){try{const C=window.AudioContext||window.webkitAudioContext;AC=new C();MG=AC.createGain();MG.gain.value=.5;const cp=AC.createDynamicsCompressor();MG.connect(cp);cp.connect(AC.destination);}catch(e){AC=false;}}
  if(AC&&AC.state==='suspended'){try{AC.resume().catch(()=>{});}catch(e){}}
  return AC||null;
}
function tone(f,dur,o){
  if(!sfxOn)return;const a=ac();if(!a)return;o=o||{};
  const t0=a.currentTime+(o.delay||0),osc=a.createOscillator(),g=a.createGain(),v=o.vol==null?.2:o.vol;
  osc.type=o.type||'sine';osc.frequency.setValueAtTime(f,t0);
  if(o.to)osc.frequency.exponentialRampToValueAtTime(Math.max(20,o.to),t0+dur);
  g.gain.setValueAtTime(.0001,t0);g.gain.exponentialRampToValueAtTime(v,t0+(o.att||.01));g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
  let n=osc;if(o.lp){const fl=a.createBiquadFilter();fl.type='lowpass';fl.frequency.value=o.lp;osc.connect(fl);n=fl;}
  n.connect(g);g.connect(MG);osc.start(t0);osc.stop(t0+dur+.05);
}
function noise(dur,o){
  if(!sfxOn)return;const a=ac();if(!a)return;o=o||{};
  const len=Math.max(1,Math.floor(a.sampleRate*dur)),buf=a.createBuffer(1,len,a.sampleRate),ch=buf.getChannelData(0);
  for(let i=0;i<len;i++)ch[i]=Math.random()*2-1;
  const src=a.createBufferSource();src.buffer=buf;const t0=a.currentTime+(o.delay||0),g=a.createGain();
  g.gain.setValueAtTime(o.vol==null?.3:o.vol,t0);g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
  let n=src;
  if(o.hp){const f=a.createBiquadFilter();f.type='highpass';f.frequency.value=o.hp;n.connect(f);n=f;}
  if(o.lp){const f=a.createBiquadFilter();f.type='lowpass';f.frequency.value=o.lp;n.connect(f);n=f;}
  n.connect(g);g.connect(MG);src.start(t0);
}

function update(dt){
  if(!S||S.mode==='pause')return;
  S.clk+=dt;
  if(S.mode==='play'){
    S.t+=dt;
    const nl=1+Math.floor(S.t/25);
    if(nl!==S.lvl){S.lvl=nl;announce('🦖','第 '+nl+' 波','恐龍吃了辣椒，變得更快了');}
    S.cdAb=Math.max(0,S.cdAb-dt);S.cdCh=Math.max(0,S.cdCh-dt);
    updChick(dt);
  }else{
    const c=S.chick;for(const k of['inv','sun','rock','giant','spin','dance','jet','magnet','disg','bub','chili'])if(c[k]>0)c[k]=Math.max(0,c[k]-dt);
  }
  let fz=false;
  if(S.tstop>0){
    S.tstop-=dt;S.tsAge+=dt;S.tsTick-=dt;
    if(S.tsInv&&S.tsAge>.16){S.tsInv=false;cv.style.filter='grayscale(1) contrast(1.15)';}
    if(S.tsTick<=0){S.tsTick=.5;S.tsAlt=!S.tsAlt;sfx.tick(S.tsAlt);}
    if(S.tstop<=0){S.tstop=0;S.tsInv=false;cv.style.filter='';S.dino.stun=Math.max(S.dino.stun,.7);sfx.unfreeze();flashScr('#ffffff',.3,.2);bump(.4);say(S.dino,'剛剛發生什麼事？');}
    else fz=true;
  }
  if(S.mode==='menu')demo(dt);else if(!fz)updDino(dt);
  if(!fz){updThings(dt);updCrits(dt);updClones(dt);}
  updCorns(dt);updParts(dt);
  if(S.mode==='play'&&!fz){updFx(dt);updFx3(dt);}
  if(S.mode==='play'&&!fz)collide();
  if(S.sf){S.sf.life-=dt;if(S.sf.life<=0)S.sf=null;}
  if(S.banner){S.banner.t+=dt;if(S.banner.t>=S.banner.life)S.banner=null;}
  S.shake=Math.max(0,S.shake-dt*1.6);S.flash=Math.max(0,S.flash-dt);
}

function drawGround3(){
  if(S.rb.length>1){
    const cols=['#ff4d4d','#ff9d3d','#ffe94d','#58e05a','#4db8ff','#8a6bff','#d66bff'];
    ctx.lineCap='round';ctx.lineWidth=5.5;
    for(let b=0;b<7;b++){
      ctx.strokeStyle=cols[b];
      for(let i=1;i<S.rb.length;i++){
        const p=S.rb[i],q=S.rb[i-1];if(Math.abs(p.x-q.x)>120||Math.abs(p.y-q.y)>120)continue;
        const l=Math.hypot(p.vx,p.vy)||1,nx=-p.vy/l,ny=p.vx/l,o=(b-3)*5.2;
        ctx.globalAlpha=clamp(p.life/p.max*1.4,0,1);ctx.beginPath();ctx.moveTo(q.x+nx*o,q.y+ny*o);ctx.lineTo(p.x+nx*o,p.y+ny*o);ctx.stroke();
      }
    }
    ctx.globalAlpha=1;
  }
  const ds=S.disco;
  if(ds){
    const cols=8,cw=W/cols,rows=Math.ceil(H/cw),sh=Math.floor(S.clk*5)*47;
    for(let r=0;r<rows;r++)for(let k=0;k<cols;k++){ctx.fillStyle='hsla('+(((r*37+k*53)+sh)%360)+',95%,60%,.28)';ctx.fillRect(k*cw,r*cw,cw-2,cw-2);}
  }
  if(S.jelly>0){
    ctx.fillStyle='rgba(255,140,200,.18)';ctx.fillRect(0,0,W,H);
    ctx.strokeStyle='rgba(255,255,255,.22)';ctx.lineWidth=2;
    for(let i=0;i<9;i++){const y=(i+.5)*H/9;ctx.beginPath();for(let x=0;x<=W;x+=20){const yy=y+Math.sin(x*.03+S.clk*6+i)*6;if(x)ctx.lineTo(x,yy);else ctx.moveTo(x,yy);}ctx.stroke();}
  }
  const h=S.hole;
  if(h){
    const k=h.t/h.life,R=22+16*k;
    const g=ctx.createRadialGradient(h.x,h.y,R*.4,h.x,h.y,R*3.4);g.addColorStop(0,'rgba(150,80,255,.55)');g.addColorStop(1,'rgba(150,80,255,0)');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(h.x,h.y,R*3.4,0,7);ctx.fill();
    for(let a=0;a<3;a++){
      ctx.strokeStyle=['#b66cff','#62e3ff','#ffffff'][a];ctx.lineWidth=3;ctx.beginPath();
      for(let i=0;i<=25;i++){const t2=i/25,ang=t2*9+S.clk*(5+a)+a*2.1,r=R*(1+t2*2.4),px=h.x+Math.cos(ang)*r,py=h.y+Math.sin(ang)*r*.8;if(i)ctx.lineTo(px,py);else ctx.moveTo(px,py);}
      ctx.stroke();
    }
    ctx.fillStyle='#05020d';ctx.beginPath();ctx.arc(h.x,h.y,R,0,7);ctx.fill();
  }
}
function drawWorld3(){
  const T=S.clk,w=S.duck;
  if(w){for(const dk of w.ducks){const by=dk.y+Math.sin(T*10+dk.ph)*4;shadow(dk.x,by+14,13,4);emoji('🦆',dk.x,by,34,Math.sin(T*8+dk.ph)*.2);}}
  const u=S.uni;
  if(u){shadow(u.x,u.y+26,26,8);emoji('🦄',u.x,u.y,66,Math.sin(T*20)*.08);}
  const o=S.orb;
  if(o){
    if(!o.fired){
      const k=Math.min(1,o.t/1.9),R=110-74*k;ctx.strokeStyle=o.t>1.6?'#ff2d2d':'#ff7a7a';ctx.lineWidth=3;
      ctx.beginPath();ctx.arc(o.x,o.y,R,0,7);ctx.stroke();ctx.beginPath();ctx.arc(o.x,o.y,R*.45,0,7);ctx.stroke();
      ctx.beginPath();ctx.moveTo(o.x-R-14,o.y);ctx.lineTo(o.x-R*.3,o.y);ctx.moveTo(o.x+R*.3,o.y);ctx.lineTo(o.x+R+14,o.y);
      ctx.moveTo(o.x,o.y-R-14);ctx.lineTo(o.x,o.y-R*.3);ctx.moveTo(o.x,o.y+R*.3);ctx.lineTo(o.x,o.y+R+14);ctx.stroke();
      if(Math.floor(o.t*8)%2)emoji('⚠️',o.x,o.y-R-24,22,0);
    }else{
      const k=(o.t-2.1)/.45;
      if(k<1){
        const w2=70*(1-k)+14,g=ctx.createLinearGradient(o.x-w2,0,o.x+w2,0);
        g.addColorStop(0,'rgba(255,200,80,0)');g.addColorStop(.35,'rgba(255,255,255,.95)');g.addColorStop(.65,'rgba(255,255,255,.95)');g.addColorStop(1,'rgba(255,200,80,0)');
        ctx.fillStyle=g;ctx.fillRect(o.x-w2,0,w2*2,o.y);
        ctx.fillStyle='rgba(255,230,160,'+(.7*(1-k))+')';ctx.beginPath();ctx.ellipse(o.x,o.y,w2*1.4,w2*.5,0,0,7);ctx.fill();
      }
    }
  }
  if(S.bolts.length){
    ctx.save();ctx.lineJoin='round';ctx.lineCap='round';
    for(const b of S.bolts){
      ctx.globalAlpha=clamp(b.life/b.max*1.5,0,1);ctx.shadowColor='#8fd0ff';ctx.shadowBlur=18;ctx.strokeStyle='#9fd8ff';ctx.lineWidth=8;
      ctx.beginPath();b.pts.forEach((q,i)=>{if(i)ctx.lineTo(q[0],q[1]);else ctx.moveTo(q[0],q[1]);});ctx.stroke();
      ctx.shadowBlur=0;ctx.strokeStyle='#ffffff';ctx.lineWidth=3;ctx.stroke();
    }
    ctx.restore();
  }
}
function drawOverlay3(){
  const T=S.clk,u=Math.min(ui,1.3);
  const st=S.storm;
  if(st){
    const a=Math.max(0,Math.min(1,st.t/.4,(st.life-st.t)/.5));
    ctx.fillStyle='rgba(8,14,44,'+(.38*a)+')';ctx.fillRect(0,0,W,H);
    ctx.strokeStyle='rgba(190,220,255,.35)';ctx.lineWidth=1.5;ctx.beginPath();
    for(let i=0;i<90;i++){const x=Math.random()*W,y=Math.random()*H;ctx.moveTo(x,y);ctx.lineTo(x-5,y+18);}
    ctx.stroke();
  }
  const ds=S.disco;
  if(ds){
    ctx.save();ctx.globalCompositeOperation='lighter';
    for(let k=0;k<6;k++){
      const bx=W*(k+.5)/6,tx=bx+Math.sin(T*1.7+k*1.3)*W*.28,ty=H*(.5+.3*Math.sin(T*1.1+k)),hue=(k*60+T*90)%360;
      ctx.fillStyle='hsla('+hue+',100%,60%,.22)';ctx.beginPath();ctx.moveTo(bx-6,0);ctx.lineTo(bx+6,0);ctx.lineTo(tx+60,ty);ctx.lineTo(tx-60,ty);ctx.closePath();ctx.fill();
      ctx.beginPath();ctx.ellipse(tx,ty,64,24,0,0,7);ctx.fill();
    }
    ctx.restore();
    emoji('🪩',W/2,28+Math.sin(T*3)*3,48,Math.sin(T*2)*.15);
  }
  const g=S.glitch;
  if(g){
    const n=RM?3:9;
    for(let i=0;i<n;i++){const sy=Math.random()*H,sh=6+Math.random()*46,dx=(Math.random()-.5)*(RM?10:60);ctx.drawImage(cv,0,Math.floor(sy*dpr),cv.width,Math.max(1,Math.floor(sh*dpr)),dx,sy,W,sh);}
    ctx.globalAlpha=.3;ctx.drawImage(cv,0,0,cv.width,cv.height,6,0,W,H);ctx.globalAlpha=1;
    ctx.fillStyle='rgba(255,255,255,.35)';for(let i=0;i<120;i++)ctx.fillRect(Math.random()*W,Math.random()*H,4+Math.random()*40,2);
    ctx.fillStyle='rgba(0,0,0,.14)';for(let y=0;y<H;y+=3)ctx.fillRect(0,y,W,1);
    if(g.t<.22){
      const bars=['#c0c0c0','#c0c000','#00c0c0','#00c000','#c000c0','#c00000','#0000c0'];
      ctx.globalAlpha=.85*(1-g.t/.22);bars.forEach((cl,i)=>{ctx.fillStyle=cl;ctx.fillRect(i*W/7,0,W/7+1,H*.7);});ctx.globalAlpha=1;
    }else if(Math.floor(g.t*2)%2===0)label('NO SIGNAL',W/2,H*.5,30*u,'center','#ffffff');
  }
  const rw=S.rw;
  if(rw){
    ctx.fillStyle='rgba(60,255,255,.07)';ctx.fillRect(0,0,W,H);
    for(let i=0;i<10;i++){const y=((i*53+T*700)%(H+40))-20;ctx.fillStyle='rgba(255,255,255,'+(.1+.08*(i%3))+')';ctx.fillRect(0,y,W,4+(i%3)*3);}
    ctx.globalAlpha=.25;ctx.drawImage(cv,0,0,cv.width,cv.height,-8,0,W,H);ctx.globalAlpha=1;
    label('◀◀ REW',14*u,H-34*u,22*u,'left','#9ffcff');
  }
  if(S.tstop>0&&S.tsAge<1){ctx.save();ctx.globalAlpha=Math.max(0,1-S.tsAge);label('時間停止！',W/2,H*.38,40*u,'center','#ffffff');ctx.restore();}
  const sl=S.slot;
  if(sl){
    const ww=58*u,gap=8*u,bw=ww*3+gap*4,bh=ww+20*u,bx=(W-bw)/2,by=H*.2;
    const win=sl.done&&sl.jack&&Math.floor(T*6)%2===0;
    ctx.fillStyle='rgba(20,16,30,.92)';rr(bx,by,bw,bh,14*u);ctx.fill();
    ctx.strokeStyle=win?'#ffe94d':(sl.done?'#ffd24a':'#8a6bff');ctx.lineWidth=4;rr(bx,by,bw,bh,14*u);ctx.stroke();
    for(let i=0;i<3;i++){
      const x=bx+gap+i*(ww+gap),y=by+10*u;
      ctx.fillStyle='#ffffff';rr(x,y,ww,ww,8*u);ctx.fill();
      emoji(sl.disp[i],x+ww/2,y+ww/2+2,38*u,0);
    }
  }
  if(S.sf){ctx.globalAlpha=clamp(S.sf.a*S.sf.life/S.sf.max,0,1);ctx.fillStyle=S.sf.color;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;}
}
function drawChick(){
  const c=S.chick,v=c.vis,T=S.clk;
  if(c.rock>0){shadow(c.x,c.y+14,18,6);emoji('🪨',c.x,c.y,40);return;}
  let y=c.y,rot=0;
  if(Math.hypot(c.vx,c.vy)>20)y-=Math.abs(Math.sin(T*14))*3*v;
  if(c.dance>0){y-=Math.abs(Math.sin(T*10))*10;rot=Math.sin(T*10)*.3;}
  if(c.spin>0)rot=c.ang;
  if(S.jelly>0)y-=c.z;
  shadow(c.x,c.y+14*v,15*v,5*v);
  if(c.inv>0&&c.sun<=0&&Math.floor(T*12)%2){ctx.strokeStyle='#ffffff';ctx.lineWidth=3;ctx.beginPath();ctx.arc(c.x,y,20*v,0,7);ctx.stroke();}
  const chCh=c.disg>0?'🦖':'🐤',chSz=(c.disg>0?30:34)*v;
  if(S.jelly>0){const air=c.z>8;ctx.save();ctx.translate(c.x,y);ctx.scale(air?.92:1.22,air?1.12:.78);emoji(chCh,0,0,chSz,rot);ctx.restore();}else emoji(chCh,c.x,y,chSz,rot);
  if(c.bub>0){ctx.fillStyle='rgba(170,225,255,.25)';ctx.strokeStyle='rgba(255,255,255,.85)';ctx.lineWidth=2;ctx.beginPath();ctx.arc(c.x,y,(30+Math.sin(T*8)*1.5)*v,0,7);ctx.fill();ctx.stroke();}
  if(c.magnet>0)emoji('🧲',c.x,y-28*v,18,0);
  if(c.chili>0)emoji('🌶️',c.x-c.face*20*v,y-16*v,14,0);
  if(c.sun>0)emoji('🕶️',c.x+1,y-2*v,19*v,rot);
  if(c.dance>0)emoji('🎵',c.x+20*v,y-24*v,16,0);
}
function drawDino(){
  const d=S.dino,T=S.clk;
  let x=d.x,y=d.y,rot=0,sc=1;
  shadow(d.x,d.y+d.r*.95,d.r*1.15,d.r*.4);
  if(d.tele>0){x+=rnd(-3,3);y+=rnd(-2,2);sc=1+.1*Math.sin(d.t*40);}
  if(d.slip>0)rot=d.t*14;
  else if(d.stun>0)rot=Math.sin(d.t*20)*.12;
  if(d.dance>0){y-=Math.abs(Math.sin(d.t*9))*14;rot=Math.sin(d.t*9)*.25;}
  if(d.eat>0)sc=1+Math.sin(d.t*22)*.05;
  y-=d.air||0;
  if(d.sheep>0)emoji('🐑',x,y+14+Math.sin(d.t*10)*3,60,Math.sin(d.t*8)*.1);else emoji('🦖',x,y,80*sc,rot);
  if(d.ice>0){ctx.globalAlpha=.65;emoji('🧊',x,y+4,96,0);ctx.globalAlpha=1;}
  const iy=y-58;
  if(d.tele>0)emoji('❗',x,iy,34+Math.sin(d.t*30)*4,0);
  else if(S.glitch)emoji('📺',x,iy,26,0);
  else if(d.stun>0||d.slip>0){for(let i=0;i<3;i++){const a=d.t*5+i*2.094;emoji('⭐',x+Math.cos(a)*26,iy+Math.sin(a)*7,15,0);}}
  else if(d.flee>0)emoji('😱',x,iy,28,0);
  else if(d.dance>0)emoji('🎵',x+22,iy,24,0);
  else if(d.eat>0)emoji('🍖',x,iy,24,0);
  else if(d.lost>0&&S.mode==='play')emoji('❓',x,iy,26,0);
  else if(d.sheep>0)emoji('🪄',x,iy,24,0);
  else if(d.tfz>0)emoji('⏳',x,iy,24,0);
  else if(d.slowT>0)emoji('🐌',x,iy,22,0);
}
function drawCrit(o){
  const sp=o.sp,T=S.clk;
  shadow(o.x,o.y+sp.size*.42,sp.size*.42,sp.size*.14);
  const bob=Math.sin((o.age+T)*(o.state==='love'?9:5))*2;
  emoji(sp.emo,o.x,o.y+bob,sp.size,0);
  if(o.state==='love'){
    ctx.strokeStyle='#ff6fa5';ctx.lineWidth=3;ctx.beginPath();
    ctx.arc(o.x,o.y,sp.size*.66,-Math.PI/2,-Math.PI/2+Math.PI*2*Math.max(0,o.life/sp.life));ctx.stroke();
    emoji(o.dazed>0?'⭐':'💗',o.x,o.y-sp.size*.85+Math.sin(T*6)*2,16,0);
  }
}
function drawMama(){const m=S.mama;shadow(m.x,m.y+24,22,7);emoji('🐔',m.x,m.y+Math.sin(S.clk*14)*2,58,0);}
function drawClone(cl){
  shadow(cl.x,cl.y+12,13,4);
  emoji('🐥',cl.x,cl.y-Math.abs(Math.sin((S.clk+cl.ph)*12))*3,30*Math.min(1,cl.life/.6),0);
}
function drawBubble(b){
  const o=b.o;if(!o)return;const u=Math.min(ui,1.3);
  const off=o===S.dino?86:(o===S.chick?34*S.chick.vis+14:(o.sp?o.sp.size*.8+14:30));
  ctx.font=(13*u)+'px '+TXT;
  const w=ctx.measureText(b.text).width+18*u,h=24*u;
  const bx=clamp(o.x-w/2,6,W-w-6),by=clamp(o.y-off-h,40*u,H-h-4),tx=clamp(o.x,bx+10*u,bx+w-10*u);
  ctx.globalAlpha=Math.min(1,b.life/.3);
  ctx.fillStyle='#ffffff';rr(bx,by,w,h,9*u);ctx.fill();
  ctx.beginPath();ctx.moveTo(tx-5*u,by+h-1);ctx.lineTo(tx,by+h+6*u);ctx.lineTo(tx+5*u,by+h-1);ctx.fill();
  ctx.fillStyle='#18281E';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(b.text,bx+w/2,by+h/2+1);
  ctx.globalAlpha=1;
}
function drawHud(){
  const c=S.chick,u=Math.min(ui,1.3);
  const g=ctx.createLinearGradient(0,0,0,44*u);g.addColorStop(0,'rgba(10,30,18,.55)');g.addColorStop(1,'rgba(10,30,18,0)');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,44*u);
  for(let i=0;i<3;i++)emoji(i<c.hp?'❤️':'🖤',18*u+i*23*u,20*u,18*u,0);
  label('第 '+S.lvl+' 波 · '+fmt(S.t),W/2+8*u,20*u,15*u,'center');
  label(String(total())+' 分',W-12*u,20*u,16*u,'right','#FFE46B');
}
function drawBanner(){
  const b=S.banner;if(!b)return;const u=Math.min(ui,1.3);
  const a=b.t<.15?b.t/.15:(b.life-b.t<.4?(b.life-b.t)/.4:1);
  const w=Math.min(W-84,400*u),h=60*u,x=Math.max(12,(W-w)/2-22),y=50*u;
  ctx.globalAlpha=Math.max(0,a);
  ctx.fillStyle='rgba(18,32,24,.88)';rr(x,y,w,h,14*u);ctx.fill();
  emoji(b.emo,x+34*u,y+h/2+1,32*u,0);
  ctx.textAlign='left';ctx.textBaseline='middle';
  ctx.font=(20*u)+'px '+TXT;ctx.fillStyle='#FFD84D';ctx.fillText(b.name,x+62*u,y+22*u);
  ctx.font=(13*u)+'px '+TXT;ctx.fillStyle='#E6EFE4';ctx.fillText(b.sub,x+62*u,y+43*u);
  ctx.globalAlpha=1;
}
function draw(){
  if(!S)return;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.globalAlpha=1;
  ctx.clearRect(0,0,W,H);
  ctx.save();
  if(S.shake>0)ctx.translate(rnd(-1,1)*S.shake*14,rnd(-1,1)*S.shake*14);
  ctx.drawImage(bg,0,0,W,H);
  drawGround3();
  for(const t of S.things){
    if(t.type==='banana'){shadow(t.x,t.y+8,12,4);emoji('🍌',t.x,t.y,26,.6);}
    else if(t.type==='cloud'){ctx.fillStyle='rgba(150,190,70,'+(.28*Math.min(1,t.life/.8))+')';ctx.beginPath();ctx.arc(t.x,t.y,t.r,0,7);ctx.fill();}
    else if(t.type==='egg'){shadow(t.x,t.y+10,12,4);const s=1+Math.sin(S.clk*(t.t<.7?40:16))*.1;emoji('🥚',t.x,t.y,26*s,0);}
    else if(t.type==='meat'){shadow(t.x,t.y+10,14,5);emoji('🍖',t.x,t.y,28,0);}
    else if(t.type==='crater'){ctx.fillStyle='rgba(30,20,16,.55)';ctx.beginPath();ctx.ellipse(t.x,t.y+4,t.r,t.r*.55,0,0,7);ctx.fill();ctx.strokeStyle='rgba(255,140,40,.6)';ctx.lineWidth=3;ctx.stroke();}
    else if(t.type==='fire'){emoji('🔥',t.x,t.y-4,(24+Math.sin(S.clk*18+t.x)*4)*Math.min(1,t.life/.8),0);}
  }
  for(const k of S.corns){shadow(k.x,k.y+12,11,4);emoji('🌽',k.x,k.y+Math.sin(k.t*4)*3,26,0);}
  const list=[];
  for(const o of S.crits)list.push([o.y,()=>drawCrit(o)]);
  for(const cl of S.clones)list.push([cl.y,()=>drawClone(cl)]);
  if(S.mama)list.push([S.mama.y,drawMama]);
  for(const fr of S.frogs)list.push([fr.y,()=>{shadow(fr.x,fr.y+12,11*(1-Math.min(.6,fr.z/500)),4);emoji('🐸',fr.x,fr.y-fr.z,28,0);}]);
  list.push([S.chick.y,drawChick]);list.push([S.dino.y+10,drawDino]);
  list.sort((a,b)=>a[0]-b[0]);list.forEach(l=>l[1]());
  if(S.ufo){const dd=S.dino,uy=dd.y-dd.air-96+Math.sin(S.clk*6)*3;
    ctx.fillStyle='rgba(255,250,170,.3)';ctx.beginPath();ctx.moveTo(dd.x-18,uy+12);ctx.lineTo(dd.x+18,uy+12);ctx.lineTo(dd.x+dd.r+14,dd.y+dd.r*.9);ctx.lineTo(dd.x-dd.r-14,dd.y+dd.r*.9);ctx.closePath();ctx.fill();
    emoji('🛸',dd.x,uy,64,0);}
  drawWorld3();
  for(const p of S.parts){
    if(p.k==='p'){ctx.globalAlpha=clamp(p.life/p.max*1.5,0,1);ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,7);ctx.fill();ctx.globalAlpha=1;}
    else if(p.k==='r'){const t=1-p.life/p.mx;ctx.strokeStyle=p.color;ctx.globalAlpha=Math.max(0,1-t);ctx.lineWidth=5;ctx.beginPath();ctx.arc(p.x,p.y,p.max*t,0,7);ctx.stroke();ctx.globalAlpha=1;}
    else{ctx.globalAlpha=clamp(p.life/p.max*1.6,0,1);if(p.ch==='+10'){ctx.font='16px '+TXT;ctx.fillStyle='#FFE46B';ctx.textAlign='center';ctx.fillText('+10',p.x,p.y);}else emoji(p.ch,p.x,p.y,p.size,0);ctx.globalAlpha=1;}
  }
  for(const b of S.bubbles)drawBubble(b);
  ctx.restore();
  if(S.flash>0){ctx.fillStyle='rgba(220,40,40,'+(S.flash*.6)+')';ctx.fillRect(0,0,W,H);}
  drawOverlay3();
  if(joy&&S.mode==='play'){
    ctx.strokeStyle='rgba(255,255,255,.55)';ctx.lineWidth=3;ctx.beginPath();ctx.arc(joy.ox,joy.oy,48,0,7);ctx.stroke();
    const dx=joy.x-joy.ox,dy=joy.y-joy.oy,l=Math.hypot(dx,dy),k=l>48?48/l:1;
    ctx.fillStyle='rgba(255,255,255,.45)';ctx.beginPath();ctx.arc(joy.ox+dx*k,joy.oy+dy*k,20,0,7);ctx.fill();
  }
  if(S.mode==='play'||S.mode==='over'||S.mode==='pause'){drawHud();drawBanner();}
}

/* ---------- 介面 ---------- */
const vStart=$('#vStart'),vOver=$('#vOver'),bAb=$('#bAb'),bCh=$('#bCh'),pad=$('#pad'),bPause=$('#bPause'),vPause=$('#vPause'),againBtn=$('#againBtn');
function buzz(ms){try{if(navigator.vibrate)navigator.vibrate(ms);}catch(e){}}
let best=0,un={};
try{best=+localStorage.getItem('dc-best')||0;un=JSON.parse(localStorage.getItem('dc-un')||'{}')||{};}catch(e){}
function bestText(){return best?'最高分 '+best:'';}
$('#bestLine').textContent=bestText();
const chipsEl=$('#chips'),chips2El=$('#chips2'),chips3El=$('#chips3');
function chipFor(i){return(i<12?chipsEl:i<24?chips2El:chips3El).children[i<12?i:i<24?i-12:i-24];}
function paintChip(i){
  const a=ABIL[i],el=chipFor(i),got=!!un[i],locked=(a.b===2&&!batch2Open())||(a.b===3&&!batch3Open());
  el.className='chip'+(got?' on':'')+(locked?' lock':'');
  el.textContent=locked?'🔒':a.emo;
  const t=locked?(a.b===2?'第一批全部收集後解鎖':'第二批全部收集後解鎖'):(got?a.name:'尚未抽到');
  el.title=t;el.setAttribute('aria-label',t);
}
ABIL.forEach((a,i)=>{const s=document.createElement('span');s.setAttribute('role','img');(i<12?chipsEl:i<24?chips2El:chips3El).appendChild(s);paintChip(i);});
function syncUnlockTitle(){
  let n1=0,n2=0,n3=0;for(let i=0;i<ABIL.length;i++)if(un[i]){if(i<12)n1++;else if(i<24)n2++;else n3++;}
  const n3t=ABIL.length-24;
  $('#unlockTitle').textContent='沙雕技收集 '+n1+' / 12';
  $('#unlock2Title').textContent=batch2Open()?'第二批沙雕技 '+n2+' / 12':'第二批沙雕技　收集完第一批後解鎖';
  $('#b3Title').textContent=batch3Open()?'第三梯次　混亂模式 '+n3+' / '+n3t:'第三梯次　收集完第二批後解鎖';
  [1,2,3].forEach(n=>{const sw=$('#bon'+n),open=n===1||(n===2?batch2Open():batch3Open());sw.disabled=!open;sw.checked=open&&!!bon[n];sw.closest('.bsw').classList.toggle('off',!open);});
}
syncUnlockTitle();
[1,2,3].forEach(n=>$('#bon'+n).addEventListener('change',e=>{
  const on=e.target.checked;
  if(!on){const others=[1,2,3].filter(k=>k!==n&&bon[k]&&(k===1||(k===2?batch2Open():batch3Open())));if(!others.length){e.target.checked=true;return;}}
  bon[n]=on?1:0;
  try{localStorage.setItem('dc-bon',JSON.stringify(bon));}catch(_){}saveCloud();
  syncUnlockTitle();
}));
/* 音效開關 */
const sfxSw=$('#sfxSw'),sfxBtn=$('#sfxBtn');
function setSfx(v){
  sfxOn=!!v;try{localStorage.setItem('dc-sfx',sfxOn?'1':'0');}catch(e){}saveCloud();
  sfxSw.checked=sfxOn;sfxBtn.textContent='音效：'+(sfxOn?'開':'關');
  if(sfxOn){ac();sfx.pop();}
}
sfxSw.checked=sfxOn;sfxBtn.textContent='音效：'+(sfxOn?'開':'關');
sfxSw.addEventListener('change',()=>setSfx(sfxSw.checked));
sfxBtn.addEventListener('click',()=>setSfx(!sfxOn));
function unlock(i){
  if(un[i])return false;
  const was=batch2Open(),was3=batch3Open();un[i]=1;
  try{localStorage.setItem('dc-un',JSON.stringify(un));}catch(e){}saveCloud();
  paintChip(i);
  const now=batch2Open(),now3=batch3Open();
  if(!was&&now)for(let j=12;j<24;j++)paintChip(j);
  if(!was3&&now3)for(let j=24;j<ABIL.length;j++)paintChip(j);
  syncUnlockTitle();
  return (!was&&now)?2:((!was3&&now3)?3:0);
}
/* 雲端存檔：登入的檢視者進度存在 db，換裝置或清快取也不會歸零；localStorage 當備援 */
let cloudDoc=null,cloudT=0;
function saveCloud(){
  if(!cloudDoc)return;
  clearTimeout(cloudT);
  cloudT=setTimeout(()=>{try{cloudDoc.set({un,bon,best,sfx:sfxOn?1:0,v:1}).catch(()=>{});}catch(e){}},500);
}
(async()=>{
  try{
    if(!window.claude||!claude.use)return;
    const [db,user]=await Promise.all([claude.use('db'),claude.use('user')]);
    if(!db||!user)return;
    const id=await user.id();if(!id)return;
    const ref=db.doc('data/users/'+id+'/save');
    const snap=await ref.get();
    const d=snap&&snap.exists?snap.data():null;
    if(d){
      if(d.un)for(const k in d.un)if(d.un[k])un[k]=1;
      if(d.bon)bon=Object.assign(bon,d.bon);
      if(+d.best>best)best=+d.best;
      if(d.sfx===0||d.sfx===1){sfxOn=!!d.sfx;sfxSw.checked=sfxOn;sfxBtn.textContent='音效：'+(sfxOn?'開':'關');}
      try{localStorage.setItem('dc-un',JSON.stringify(un));localStorage.setItem('dc-bon',JSON.stringify(bon));localStorage.setItem('dc-best',String(best));}catch(e){}
      for(let i=0;i<ABIL.length;i++)paintChip(i);
      syncUnlockTitle();$('#bestLine').textContent=bestText();
    }
    cloudDoc=ref;saveCloud();
  }catch(e){}
})();
const zoo=$('#zoo');
SPECIES.forEach(s=>{const d=document.createElement('div');d.className='pal';d.innerHTML='<span class="e"></span><div><strong></strong><span class="t"></span></div>';d.querySelector('.e').textContent=s.emo;d.querySelector('strong').textContent=s.name;d.querySelector('.t').textContent=s.fx;zoo.appendChild(d);});

function enterFs(){
  const de=document.documentElement;
  de.classList.add('fs');window.scrollTo(0,0);
  try{const r=de.requestFullscreen||de.webkitRequestFullscreen;if(r&&!document.fullscreenElement){const pr=r.call(de);if(pr&&pr.catch)pr.catch(()=>{});}}catch(e){}
}
function leaveFs(){
  document.documentElement.classList.remove('fs');
  try{if(document.fullscreenElement){const pr=document.exitFullscreen();if(pr&&pr.catch)pr.catch(()=>{});}}catch(e){}
}
function goHome(){
  leaveFs();sizeWorld();newGame();
  vPause.hidden=true;vOver.hidden=true;vStart.hidden=false;
  $('#bestLine').textContent=bestText();
}
function startGame(){
  if(sfxOn)ac();
  enterFs();sizeWorld();
  newGame();S.mode='play';vStart.hidden=true;vOver.hidden=true;vPause.hidden=true;
  if(document.activeElement&&document.activeElement.blur)document.activeElement.blur();
  announce('🐤','撐住','先跑，剩下的邊跑邊想');
}
function togglePause(){
  if(!S)return;
  if(S.mode==='play'){S.mode='pause';joy=null;for(const k in keys)keys[k]=false;vPause.hidden=false;}
  else if(S.mode==='pause'){S.mode='play';vPause.hidden=true;S.chick.inv=Math.max(S.chick.inv,1.3);}
}
function rating(s){
  if(s<100)return'剛孵出來就下班。下一局記得按空白鍵。';
  if(s<300)return'有在掙扎，但恐龍比較餓。';
  if(s<600)return'沙雕力有進步，多交幾個朋友會更穩。';
  if(s<1000)return'恐龍已經認得你的臉了。';
  return'傳說級小雞，動物們願意為你打架。';
}
function gameOver(){
  S.mode='over';S.dino.lost=99;clearFx();
  const sc=total();
  if(sc>best){best=sc;try{localStorage.setItem('dc-best',String(best));}catch(e){}saveCloud();}
  $('#rate').textContent=rating(sc);
  $('#stT').textContent=fmt(S.t);$('#stS').textContent=sc+' 分';
  $('#stC').textContent=S.charmed+' 隻';$('#stD').textContent=S.stuns+' 次';$('#stU').textContent=S.used+' 次';
  $('#bestLine2').textContent='最高分 '+best;$('#bestLine').textContent=bestText();
  vOver.hidden=false;againBtn.disabled=true;
  setTimeout(()=>{againBtn.disabled=false;againBtn.focus();},1000);
}
$('#goBtn').addEventListener('click',startGame);
againBtn.addEventListener('click',startGame);
bAb.addEventListener('pointerdown',e=>{e.preventDefault();doAbility();});
bPause.addEventListener('pointerdown',e=>{e.preventDefault();togglePause();});
$('#resumeBtn').addEventListener('click',togglePause);
$('#restartBtn').addEventListener('click',startGame);
$('#exitBtn').addEventListener('click',goHome);
$('#homeBtn').addEventListener('click',goHome);
document.addEventListener('visibilitychange',()=>{if(document.hidden&&S&&S.mode==='play')togglePause();});
bCh.addEventListener('pointerdown',e=>{e.preventDefault();doCharm();});

addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();
  if([' ','arrowup','arrowdown','arrowleft','arrowright'].includes(k)&&S&&S.mode==='play')e.preventDefault();
  if(e.repeat)return;
  if((k==='enter'||k===' ')&&S&&S.mode==='menu'&&!(e.target&&e.target.tagName==='BUTTON')){e.preventDefault();startGame();return;}
  if((k==='p'||k==='escape')&&S&&(S.mode==='play'||S.mode==='pause')){togglePause();return;}
  keys[k]=true;
  if(!S||S.mode!=='play')return;
  if(k===' ')doAbility();
  if(k==='e')doCharm();
});
addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false;joy=null;});

function pt(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H};}
cv.addEventListener('pointerdown',e=>{
  if(!S||S.mode!=='play'||joy)return;
  e.preventDefault();
  const p=pt(e);joy={id:e.pointerId,ox:p.x,oy:p.y,x:p.x,y:p.y};
  try{cv.setPointerCapture(e.pointerId);}catch(err){}
});
cv.addEventListener('pointermove',e=>{if(joy&&joy.id===e.pointerId){const p=pt(e);joy.x=p.x;joy.y=p.y;}});
const endJoy=e=>{if(joy&&joy.id===e.pointerId)joy=null;};
cv.addEventListener('pointerup',endJoy);cv.addEventListener('pointercancel',endJoy);cv.addEventListener('lostpointercapture',endJoy);
$('#stage').addEventListener('contextmenu',e=>e.preventDefault());

let pa=-1,pc=-1;
function syncUI(){
  const a=S.mode==='play'?S.cdAb/AB_CD:1,c=S.mode==='play'?S.cdCh/(S.chMax||CH_CD):1;
  const qa=Math.round(a*100),qc=Math.round(c*100);
  if(qa!==pa){pa=qa;bAb.style.setProperty('--p',a);}
  if(qc!==pc){pc=qc;bCh.style.setProperty('--p',c);}
  const show=S.mode==='play';if(pad.hidden===show)pad.hidden=!show;if(bPause.hidden===show)bPause.hidden=!show;
}
function loop(ts){
  const dt=Math.min(.05,(ts-last)/1000||0);last=ts;
  update(dt);draw();syncUI();if((frame++&63)===0)calcUi();
  requestAnimationFrame(loop);
}
let rzT=0;
function onResize(){clearTimeout(rzT);rzT=setTimeout(()=>{if(worldFor().k!==wk)sizeWorld();else calcUi();},80);}
addEventListener('resize',onResize);
if(window.visualViewport)window.visualViewport.addEventListener('resize',onResize);
document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement&&S&&S.mode==='play')togglePause();onResize();});
sizeWorld();newGame();
if(document.fonts&&document.fonts.load){document.fonts.load('16px Huninn').catch(()=>{});}
requestAnimationFrame(loop);
})();
</script>
